<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anexos - Feria Científica de Biología</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #08121e;
      position: relative;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Fondo con menos contraste usando overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('fondo-ave-maria.png');
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      opacity: 0.15;
      z-index: -1;
    }

    header {
      background-color: #060e18;
      padding: 15px 5%;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      height: 45px;
      width: auto;
      margin-right: 15px;
    }

    .title-header {
      font-size: 1.2rem;
      font-weight: bold;
      color: #ffffff;
    }

    main {
      width: 90%;
      max-width: 1200px;
      margin: 30px auto;
    }

    .main-title {
      font-size: 1.8rem;
      margin-bottom: 30px;
      color: #ffffff;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    .section-tissue {
      margin-bottom: 50px;
    }

    .section-title {
      font-size: 1.25rem;
      color: #ffffff;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Grid Responsive */
    .image-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      width: 100%;
    }

    .img-container {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    /* Imágenes adaptables */
    .tissue-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      /* Carga suave al hacer scroll */
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .tissue-img.visible {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #060e18;
      color: #aaaaaa;
      font-size: 0.85rem;
      margin-top: 40px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* Adaptación 100% Responsive para móviles y tablets */
    @media (max-width: 900px) {
      .image-row {
        grid-template-columns: repeat(2, 1fr);
      }
      .tissue-img {
        height: 180px;
      }
    }

    @media (max-width: 550px) {
      .image-row {
        grid-template-columns: 1fr;
      }
      .tissue-img {
        height: 220px;
      }
      header {
        padding: 12px 4%;
      }
      .logo {
        height: 38px;
      }
      .title-header {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="logo-ave-maria.png" alt="Logo Colegio Ave María" class="logo">
    <div class="title-header">Feria Científica de Biología</div>
  </header>

  <main>
    <h1 class="main-title">Anexos</h1>

    <!-- 1. Tejido Adiposo -->
    <section class="section-tissue">
      <h2 class="section-title">Tejido Adiposo</h2>
      <div class="image-row">
        <div class="img-container"><img src="tejido-adiposo-1.png" alt="Imagen Tejido Adiposo" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-adiposo-2.png" alt="Imagen Tejido Adiposo" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-adiposo-3.png" alt="Imagen Tejido Adiposo" class="tissue-img" loading="lazy"></div>
      </div>
    </section>

    <!-- 2. Tejido Sanguíneo -->
    <section class="section-tissue">
      <h2 class="section-title">Tejido Sanguíneo</h2>
      <div class="image-row">
        <div class="img-container"><img src="tejido-sanguineo-1.png" alt="Imagen Tejido Sanguíneo" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-sanguineo-2.png" alt="Imagen Tejido Sanguíneo" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-sanguineo-3.png" alt="Imagen Tejido Sanguíneo" class="tissue-img" loading="lazy"></div>
      </div>
    </section>

    <!-- 3. Tejido Muscular -->
    <section class="section-tissue">
      <h2 class="section-title">Tejido Muscular</h2>
      <div class="image-row">
        <div class="img-container"><img src="tejido-muscular-1.png" alt="Imagen Tejido Muscular" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-muscular-2.png" alt="Imagen Tejido Muscular" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-muscular-3.png" alt="Imagen Tejido Muscular" class="tissue-img" loading="lazy"></div>
      </div>
    </section>

    <!-- 4. Tejido Epitelial -->
    <section class="section-tissue">
      <h2 class="section-title">Tejido Epitelial</h2>
      <div class="image-row">
        <div class="img-container"><img src="tejido-epitelial-1.png" alt="Imagen Tejido Epitelial" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-epitelial-2.png" alt="Imagen Tejido Epitelial" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-epitelial-3.png" alt="Imagen Tejido Epitelial" class="tissue-img" loading="lazy"></div>
      </div>
    </section>

    <!-- 5. Tejido Nervioso -->
    <section class="section-tissue">
      <h2 class="section-title">Tejido Nervioso</h2>
      <div class="image-row">
        <div class="img-container"><img src="tejido-nervioso-1.png" alt="Imagen Tejido Nervioso" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-nervioso-2.png" alt="Imagen Tejido Nervioso" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-nervioso-3.png" alt="Imagen Tejido Nervioso" class="tissue-img" loading="lazy"></div>
      </div>
    </section>

    <!-- 6. Tejido Conectivo -->
    <section class="section-tissue">
      <h2 class="section-title">Tejido Conectivo</h2>
      <div class="image-row">
        <div class="img-container"><img src="tejido-conectivo-1.png" alt="Imagen Tejido Conectivo" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-conectivo-2.png" alt="Imagen Tejido Conectivo" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-conectivo-3.png" alt="Imagen Tejido Conectivo" class="tissue-img" loading="lazy"></div>
      </div>
    </section>

    <!-- 7. Tejido Óseo -->
    <section class="section-tissue">
      <h2 class="section-title">Tejido Óseo</h2>
      <div class="image-row">
        <div class="img-container"><img src="tejido-oseo-1.png" alt="Imagen Tejido Óseo" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-oseo-2.png" alt="Imagen Tejido Óseo" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-oseo-3.png" alt="Imagen Tejido Óseo" class="tissue-img" loading="lazy"></div>
      </div>
    </section>

    <!-- 8. Tejido Cartilaginoso -->
    <section class="section-tissue">
      <h2 class="section-title">Tejido Cartilaginoso</h2>
      <div class="image-row">
        <div class="img-container"><img src="tejido-cartilaginoso-1.png" alt="Imagen Tejido Cartilaginoso" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-cartilaginoso-2.png" alt="Imagen Tejido Cartilaginoso" class="tissue-img" loading="lazy"></div>
        <div class="img-container"><img src="tejido-cartilaginoso-3.png" alt="Imagen Tejido Cartilaginoso" class="tissue-img" loading="lazy"></div>
      </div>
    </section>

  </main>

  <footer>
    Unidad Educativa Ave María - Curso 5º B
  </footer>

  <script>
    // Animación de carga progresiva suave al hacer scroll (Lazy reveal)
    document.addEventListener("DOMContentLoaded", function() {
      const images = document.querySelectorAll(".tissue-img");

      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, {
        rootMargin: "0px 0px -50px 0px",
        threshold: 0.15
      });

      images.forEach(img => {
        observer.observe(img);
      });
    });
  </script>

</body>
</html>
